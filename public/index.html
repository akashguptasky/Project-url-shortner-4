<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Noxship — URL Shortener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Faded long-URL texture behind everything -->
  <div class="bg-noise" aria-hidden="true" id="bgNoise"></div>

  <nav class="topbar">
    <a class="brand" href="/">
      <svg class="logo" viewBox="0 0 48 28" width="34" height="20" aria-hidden="true">
        <circle cx="15" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="4"/>
        <circle cx="33" cy="14" r="10" fill="none" stroke="currentColor" stroke-width="4"/>
      </svg>
      <span>Noxship</span>
    </a>
    <span class="tag">no signup needed</span>
  </nav>

  <main class="hero">
    <h1>
      Links this
      <span class="strike">loooooooong</span>
      become this short.
    </h1>
    <p class="sub">
      Paste any ugly, endless URL. Get back a clean link that fits in a
      tweet, a bio, a message — anywhere.
    </p>

    <form id="shorten-form" class="snipbar" autocomplete="off">
      <input
        type="text"
        id="longUrl"
        placeholder="https://paste-your-very-long-url-here.com/with/all?the=query&params"
        required
      />
      <button type="submit" id="submitBtn">
        <span>SNIP IT</span>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M9.64 7.64a3 3 0 1 0-1.06 1.06L11 11.06l-6.36 6.36a3 3 0 1 0 1.06 1.06L12 12.12l1.29 1.29-.65.65a3 3 0 1 0 1.06 1.06l6.66-6.66-1.06-1.06L12 10.94zM6 7a1 1 0 1 1 0-2 1 1 0 0 1 0 2m0 12a1 1 0 1 1 0-2 1 1 0 0 1 0 2m9-2a1 1 0 1 1 0-2 1 1 0 0 1 0 2"/>
        </svg>
      </button>
    </form>

    <p id="error" class="error hidden"></p>

    <section id="result" class="result hidden">
      <span class="result-label">Your short link</span>
      <div class="short-row">
        <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
        <button id="copyBtn" type="button">Copy</button>
      </div>
      <p class="meta">code <span id="urlCode"></span></p>
    </section>
  </main>

  <footer class="foot">
    <span>Noxship · URL Shortener</span>
  </footer>

  <script src="script.js"></script>
</body>
</html>
